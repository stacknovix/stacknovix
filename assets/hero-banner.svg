<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="stacknovix profile banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .title { font: 700 42px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f8fafc; letter-spacing: 0.5px; }
      .sub { font: 500 18px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #cbd5e1; }
      .tag { font: 600 13px 'Consolas', 'Courier New', monospace; fill: #7dd3fc; }
    </style>
  </defs>

  <rect width="900" height="200" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="196" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Subtle grid dots -->
  <g fill="#38bdf8" opacity="0.16">
    <circle cx="52" cy="36" r="2"/><circle cx="84" cy="36" r="2"/><circle cx="116" cy="36" r="2"/>
    <circle cx="784" cy="140" r="2"/><circle cx="816" cy="140" r="2"/><circle cx="848" cy="140" r="2"/>
    <circle cx="784" cy="166" r="2"/><circle cx="816" cy="166" r="2"/><circle cx="848" cy="166" r="2"/>
  </g>

  <!-- Centered hero typography -->
  <text x="450" y="78" text-anchor="middle" class="title">Hi, I'm stacknovix</text>
  <rect x="310" y="94" width="280" height="4" rx="2" fill="url(#accent)"/>
  <text x="450" y="130" text-anchor="middle" class="sub">Software Engineer • Full-Stack, APIs, AI/ML &amp; Data Systems</text>
  <text x="450" y="160" text-anchor="middle" class="tag">7+ years building reliable web apps, retrieval systems, ML models &amp; data pipelines</text>
</svg>
